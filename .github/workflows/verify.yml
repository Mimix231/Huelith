name: Huelith quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-and-native:
    name: Validate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Windows NSIS release smoke build
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --bundles nsis
      - name: Attach desktop build (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huelith-windows-nsis-unverified-installer
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
