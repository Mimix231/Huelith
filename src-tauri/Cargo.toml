[package]
name = "huelith"
version = "0.2.0"
description = "Huelith: free and open creative editor"
authors = ["Huelith Contributors"]
edition = "2021"

[lib]
name = "huelith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

# Enumerate native fonts on Windows, macOS and Linux without hard-coded font lists.
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Aurora D: native cross-platform compute backend, no requirement for a dGPU.
# The CPU backend remains available if no compatible adapter exists.
wgpu = "0.19"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
